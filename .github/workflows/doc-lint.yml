name: doc-lint

# 文件 lint：名詞（_Avoid_ 詞、<u> 標籤）與 CONTEXT.md 格式。任何一支失敗，PR 就不過。
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check_terms（_Avoid_ 詞、<u>）
        run: python3 script/check_terms.py
      - name: check_context（CONTEXT.md 格式）
        run: python3 script/check_context.py
