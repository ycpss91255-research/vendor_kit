name: docs

# 文件類的檢查都放這支，一種檢查一個 job。程式碼 lint 之後放 lint.yml，測試放 test.yml。
# 不加 paths 過濾：這些 job 會設成 ruleset 的必過檢查，被過濾跳過的必過檢查會一直停在 Pending，PR 就 merge 不了。
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check_terms（_Avoid_ 詞、<u>）
        run: python3 script/check_terms.py
      - name: check_context（CONTEXT.md 格式）
        run: python3 script/check_context.py
