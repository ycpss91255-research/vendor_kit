name: docs

# 文件類的檢查都放這支，一種檢查一個 job。script/ 底下工具自己的測試（script/doc/test、script/repo/test、script/workflow/test）也在這支；VK 程式碼的 lint 放 lint.yml、測試（根目錄 test/）放 test.yml。
# 不加 paths 過濾：這些 job 會設成 ruleset 的必過檢查，被過濾跳過的必過檢查會一直停在 Pending，PR 就 merge 不了。
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check_terms（_Avoid_ 詞、<u>）
        run: python3 script/doc/check_terms.py
      - name: check_context（CONTEXT.md 格式）
        run: python3 script/doc/check_context.py
      - name: check_messages（訊息表 03_output.csv：格式、代碼、欄位規則、引用）
        run: python3 script/doc/check_messages.py
      - name: check_typography（排版：ASCII 括號用半形、中文與英數之間空一格）
        run: python3 script/doc/check_typography.py
      - name: check_review_pages（對外頁寫法：目錄、HTML、連結與錨點、往前依賴、指令選項先定義）
        run: python3 script/doc/check_review_pages.py
      - name: check_script_layout（script/ 依類型分子目錄：頂層只准 README.md、類別名小寫英數與連字號、每類要有 README.md）
        run: python3 script/repo/check_script_layout.py

  # script/ 底下工具自己的測試；VK 程式碼的測試放根目錄 test/ 與 test.yml，不混在這裡
  docs-tool-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: script/doc/test（文件工具測試）
        run: python3 -m unittest discover -s script/doc/test -v
      - name: script/repo/test（repo 結構檢查的測試）
        run: python3 -m unittest discover -s script/repo/test -v
      - name: script/workflow/test（workflow 機械步驟腳本的測試）
        run: python3 -m unittest discover -s script/workflow/test -v
