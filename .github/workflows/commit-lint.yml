name: commit-lint

# commit 訊息格式檢查（#110）：PR 標題與 PR 裡每個 commit 都用 script/git/check_commit_msg.py 檢查。
# PR 用 merge commit 進 main，GitHub 會在 PR 標題後面加上「 (#<PR 編號>)」當 merge commit 的標題，
# 所以檢查 PR 標題時先補上這段再檢查，merge 後的標題才不會超過 72 欄。
# 不加 paths 過濾：之後要設成 ruleset 的必過檢查，被過濾跳過的必過檢查會一直停在 Pending。
# 生效點：#59 已拆完；這個 workflow merge 之後由維護者把 commit-lint 加進 ruleset 必過檢查。
# 進 main 之前的舊 commit 不追溯、不改寫；這裡只檢查 PR 內新增的 commit。
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  commit-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: PR 標題（補上 merge 時 GitHub 會加的「 (#N)」再檢查）
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: printf '%s (#%s)\n' "$PR_TITLE" "$PR_NUMBER" | python3 script/git/check_commit_msg.py --title -
      - name: PR 裡的每個 commit（merge commit 豁免；把 main 併進分支的 merge commit 會擋，請改用 rebase）
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 script/git/check_commit_msg.py --range "$BASE_SHA..$HEAD_SHA"
