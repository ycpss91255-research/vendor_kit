# VK 在 Docker 內的程式都在這個 workspace（#372）：engine/ 一個模組一個 crate，test/ 放只經執行檔的端到端測試，與讀原始碼的靜態檢查（模組邊界、原因代碼使用）。
[workspace]
resolver = "2"
members = [
    "engine/vendor_kit",
    "engine/diagnostics",
    "engine/output",
    "engine/message_types",
    "engine/messages",
    "engine/files",
    "engine/imageref",
    "engine/compat",
    "engine/schema",
    "engine/layout",
    "engine/config",
    "engine/filelock",
    "engine/prompt",
    "engine/metadata",
    "engine/stamp",
    "engine/merge",
    "engine/args",
    "engine/version_file",
    "engine/progress",
    "engine/shell",
    "engine/retract",
    "engine/runlog",
    "engine/plan",
    "engine/msggen",
    "engine/txn",
    "engine/fetch",
    "engine/initfiles",
    "engine/tools_just",
    "engine/add",
    "engine/sync",
    "engine/remove",
    "engine/install",
    "engine/update",
    "engine/upgrade",
    "engine/dev",
    "engine/prune",
    "engine/shell_check",
    "engine/registry",
    "engine/check",
    "test/e2e",
    "test/boundary",
    "test/reason_lint",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false

[workspace.dependencies]
diagnostics = { path = "engine/diagnostics" }
output = { path = "engine/output" }
message_types = { path = "engine/message_types" }
messages = { path = "engine/messages" }
files = { path = "engine/files" }
imageref = { path = "engine/imageref" }
compat = { path = "engine/compat" }
schema = { path = "engine/schema" }
layout = { path = "engine/layout" }
config = { path = "engine/config" }
filelock = { path = "engine/filelock" }
prompt = { path = "engine/prompt" }
metadata = { path = "engine/metadata" }
stamp = { path = "engine/stamp" }
merge = { path = "engine/merge" }
args = { path = "engine/args" }
version_file = { path = "engine/version_file" }
progress = { path = "engine/progress" }
shell = { path = "engine/shell" }
retract = { path = "engine/retract" }
runlog = { path = "engine/runlog" }
plan = { path = "engine/plan" }
txn = { path = "engine/txn" }
fetch = { path = "engine/fetch" }
initfiles = { path = "engine/initfiles" }
tools_just = { path = "engine/tools_just" }
add = { path = "engine/add" }
sync = { path = "engine/sync" }
remove = { path = "engine/remove" }
install = { path = "engine/install" }
update = { path = "engine/update" }
upgrade = { path = "engine/upgrade" }
dev = { path = "engine/dev" }
prune = { path = "engine/prune" }
shell_check = { path = "engine/shell_check" }
registry = { path = "engine/registry" }
check = { path = "engine/check" }

# 第三方 crate 清單（#576）：只有登記在這裡的 crate 能用，各 crate 一律以 `workspace = true` 引用。
# 篩選標準（依序，前面的優先）：
# 1. 穩定性：長期維護、已有 1.0 或 API 長期不變的版本，同一種功能只留一個 crate。
# 2. 能進最終 image：musl 靜態連結，x86_64 與 aarch64 都要在 image/Dockerfile 的 test stage 編得過；
#    要編 C 的 crate 只在沒有成熟的純 Rust 替代時才用。
# 3. 依賴樹小：只開用得到的 feature，不引入 async runtime（引擎沒有並行 I/O 的需求）。
# 新增或換掉 crate 時先改這份清單與理由，再用。

# 連進引擎執行檔的：
# - toml_edit：讀寫 VK 的 TOML，寫回時保留使用者的格式與未知欄位（schema、config 等）。
# - serde_json、serde：JSON 的解析與跳脫（`docker image inspect` 的輸出、執行紀錄的正規形）。
# - sha2：檔案的 sha256 指紋（files）。
# - nix：std 沒包的 POSIX 呼叫（flock、檢查 close 的錯誤），只開各 crate 要的 feature。
# - tempfile：merge 給 git merge-file 的暫存目錄；其他 crate 只在測試用它建暫存目錄。
# - ureq（default-features = false, features = ["rustls"]）：registry 向 GHCR 發 HTTPS 請求。
#   ureq 是同步 client，`rustls` feature 帶 rustls、ring 與 webpki-roots；CA 憑證用 webpki-roots
#   編進執行檔，最終 image 不必裝 ca-certificates。ring 要編 C：vendor_kit 經 update 依賴 registry，
#   image/Dockerfile 的 test stage 因此裝了 musl 的 C 編譯器（Debian 的 musl-tools），musl 靜態編譯才編得過。
#   比較過的方案與結果見 #577。
toml_edit = "0.25"
serde_json = "1"
serde = "1"
sha2 = "0.10"
nix = { version = "0.30", default-features = false }
tempfile = "3"
ureq = { version = "3", default-features = false, features = ["rustls"] }

# 只在建置時用的：
# - csv：msggen 與 test/reason_lint 讀訊息表 doc/contract/reason_codes.csv。
csv = "1"

# 只在測試用的：
# - assert_cmd、snapbox：端到端測試呼叫執行檔並比對輸出（test/e2e）。
# - cargo_metadata、roxmltree：模組邊界檢查讀 workspace 依賴與架構圖（test/boundary）。
# - regex：端到端測試拿 Renovate preset 的 matchStrings 比對引擎寫出的 version.toml（test/e2e）。
#   Renovate 以 RE2 編 matchStrings，regex 跟 RE2 一樣不支援 lookaround 與 backreference，語法最接近。
assert_cmd = "2"
snapbox = "1"
cargo_metadata = "0.23"
roxmltree = "0.21"
regex = "1"

# 測試例外：各 crate 在 #[cfg(test)] 與 test/ 的測試檔以 allow 屬性放行 unwrap／expect。
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
