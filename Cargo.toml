# VK 在 Docker 內的程式都在這個 workspace（#372）：engine/ 一個模組一個 crate，test/ 放只經執行檔的端到端測試，與讀原始碼的靜態檢查（模組邊界、原因代碼使用）。
[workspace]
resolver = "2"
members = [
    "engine/vendor_kit",
    "engine/diagnostics",
    "engine/output",
    "engine/messages",
    "engine/files",
    "engine/imageref",
    "engine/compat",
    "engine/schema",
    "engine/layout",
    "engine/config",
    "engine/filelock",
    "engine/prompt",
    "engine/metadata",
    "engine/stamp",
    "engine/merge",
    "engine/args",
    "engine/version_file",
    "engine/progress",
    "engine/shell",
    "engine/retract",
    "engine/runlog",
    "engine/plan",
    "engine/msggen",
    "engine/txn",
    "engine/fetch",
    "engine/initfiles",
    "engine/tools_just",
    "engine/add",
    "engine/sync",
    "test/e2e",
    "test/boundary",
    "test/reason_lint",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false

[workspace.dependencies]
diagnostics = { path = "engine/diagnostics" }
output = { path = "engine/output" }
messages = { path = "engine/messages" }
files = { path = "engine/files" }
imageref = { path = "engine/imageref" }
compat = { path = "engine/compat" }
schema = { path = "engine/schema" }
layout = { path = "engine/layout" }
config = { path = "engine/config" }
filelock = { path = "engine/filelock" }
prompt = { path = "engine/prompt" }
metadata = { path = "engine/metadata" }
stamp = { path = "engine/stamp" }
merge = { path = "engine/merge" }
args = { path = "engine/args" }
version_file = { path = "engine/version_file" }
progress = { path = "engine/progress" }
shell = { path = "engine/shell" }
retract = { path = "engine/retract" }
runlog = { path = "engine/runlog" }
plan = { path = "engine/plan" }
txn = { path = "engine/txn" }
fetch = { path = "engine/fetch" }
initfiles = { path = "engine/initfiles" }
tools_just = { path = "engine/tools_just" }
add = { path = "engine/add" }
sync = { path = "engine/sync" }
csv = "1"
assert_cmd = "2"
snapbox = "1"
tempfile = "3"
cargo_metadata = "0.23"
roxmltree = "0.21"
sha2 = "0.10"
toml_edit = "0.25"
nix = { version = "0.30", default-features = false }
serde_json = "1"

# 測試例外：各 crate 在 #[cfg(test)] 與 test/ 的測試檔以 allow 屬性放行 unwrap／expect。
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
