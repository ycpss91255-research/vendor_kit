# VK 在 Docker 內的程式都在這個 workspace（#372）：engine/ 一個模組一個 crate，test/ 放只經執行檔的端到端測試與模組邊界檢查。
[workspace]
resolver = "2"
members = [
    "engine/vendor_kit",
    "engine/diagnostics",
    "engine/output",
    "engine/messages",
    "engine/files",
    "engine/imageref",
    "engine/compat",
    "engine/schema",
    "engine/layout",
    "engine/config",
    "engine/msggen",
    "test/e2e",
    "test/boundary",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false

[workspace.dependencies]
diagnostics = { path = "engine/diagnostics" }
output = { path = "engine/output" }
messages = { path = "engine/messages" }
files = { path = "engine/files" }
imageref = { path = "engine/imageref" }
compat = { path = "engine/compat" }
schema = { path = "engine/schema" }
layout = { path = "engine/layout" }
config = { path = "engine/config" }
csv = "1"
assert_cmd = "2"
snapbox = "1"
tempfile = "3"
cargo_metadata = "0.23"
roxmltree = "0.21"
sha2 = "0.10"
toml_edit = "0.25"
nix = { version = "0.30", default-features = false }

# 測試例外：各 crate 在 #[cfg(test)] 與 test/ 的測試檔以 allow 屬性放行 unwrap／expect。
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
