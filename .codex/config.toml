# Allow routine commands and edits inside this repository while requiring
# approval before Codex crosses the workspace boundary.
sandbox_mode = "danger-full-access"
approval_policy = "on-request"

[sandbox_workspace_write]
writable_roots = ["~/Desktop/vendor-kit_ws/worktree"]

[agents]
max_concurrent_threads_per_session = 100

# Run the draw.io MCP package already in the npm cache (downloaded by Claude
# Code).  `--offline` resolves it from the cache only, so this neither installs
# nor updates host packages; the version is pinned instead of @latest.  Keep a
# separate HTTP port because Claude's stdio MCP instance currently owns 6002.
[mcp_servers.drawio]
command = "npm"
args = ["exec", "--offline", "--yes", "--package=@next-ai-drawio/mcp-server@0.2.3", "--", "next-ai-drawio-mcp"]
env = { PORT = "6003" }
